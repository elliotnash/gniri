# Pass marks for `cargo xtask diff` (crates/xtask/src/diff.rs).

# Tier 1, layout: largest difference of any box edge, in logical pixels.
layout_px = 0.5

# Tier 2, flat wallpaper. A pixel differs if a channel is more than the fuzz
# outside the range the other picture has within one pixel of it (so the
# antialiasing of an edge that GNOME snaps to the pixel grid is not a
# difference, and a wrong colour or a missing line is). At most this share
# of a region's pixels may differ. Text is excluded.
flat_fuzz_percent = 2.0
flat_differing_percent = 0.5

# Tier 3, real wallpaper: both sides are blurred by this sigma (pixels)
# first, then compared by RMS error and by mean brightness.
real_lowpass_sigma = 2.0
real_rmse_percent = 3.0
real_brightness_percent = 2.0
