# The quick settings menu: gniri's widgets against GNOME Shell's actors.
# Read by `cargo xtask diff quick-settings` (crates/xtask/src/diff.rs).

surface = "gniri-stage"
root = ".quick-settings"
# It hangs from the right end of the panel.
attach = "right"
# Its shadow is compared too.
margin = 12
wallpaper = "/usr/share/backgrounds/f45/default/f45-01-night.jxl"

[[states]]
scene = "quick-settings"
reference = "quick-settings"
# The submenu's pairs are not there to compare.
pairs = [
    "grid", "system row", "battery button", "battery icon", "battery level",
    "screenshot button", "screenshot icon", "settings button", "lock button",
    "power button", "volume row", "volume icon button", "volume icon",
    "volume slider bin", "volume slider", "volume menu button",
    "brightness row", "brightness slider",
    "wifi", "wifi toggle", "wifi icon", "wifi title", "wifi subtitle",
    "wifi separator", "wifi menu button", "wifi arrow",
    "bluetooth", "bluetooth toggle", "bluetooth title", "bluetooth menu button",
    "power mode", "power mode title", "power mode subtitle",
    "night light", "night light icon", "night light title",
    "dark style", "do not disturb", "airplane mode", "airplane mode title",
]

[[states]]
scene = "quick-settings-submenu"
reference = "quick-settings-submenu"

[[regions]]
name = "menu"
anchor = "stretch"

# Selectors: crates/xtask/src/tree.rs. Ours start at the menu
# (.quick-settings); GNOME's at the actor that holds the menu and its
# submenus.
#
# Pairs that depend on the size of a piece of text allow one pixel, as in
# panel.toml.

[[pairs]]
name = "grid"
ours = ".quick-settings-grid"
theirs = ".quick-settings-grid"
anchor = "left"

[[pairs]]
name = "system row"
ours = ".quick-settings-system-item"
theirs = ".quick-settings-system-item"
anchor = "left"

[[pairs]]
name = "battery button"
ours = ".power-item"
theirs = ".power-item"
anchor = "left"
tolerance_px = 1.1

[[pairs]]
name = "battery icon"
ours = ".power-item .quick-toggle-icon"
theirs = ".power-item .quick-toggle-icon ClutterActor"
anchor = "left"

[[pairs]]
name = "battery level"
ours = ".power-item .quick-toggle-title"
ours_box = "text"
theirs = ".power-item ClutterText"
anchor = "left"
tolerance_px = 1.1

[[pairs]]
name = "screenshot button"
ours = ".quick-settings-system-item .icon-button:0"
theirs = "Gjs_status_system_ScreenshotItem"
anchor = "right"

[[pairs]]
name = "screenshot icon"
ours = ".quick-settings-system-item .icon-button:0 GtkImage"
theirs = "Gjs_status_system_ScreenshotItem StIcon"
anchor = "right"

[[pairs]]
