# The authentication dialog, as in GNOME's `polkit-dialog` reference
# capture: `pkexec true`, waiting for the password.

[fixture]
time = "2026-11-14T08:28:00"
power = { profile = "performance", battery = { percentage = 91 } }
network = { primary = { kind = "wifi", strength = 70 } }
user = { name = "user", real_name = "Example User" }
lock = { password = "open sesame" }

[fixture.polkit.request]
action_id = "org.freedesktop.policykit.exec"
message = "Authentication is needed to run `/usr/bin/true' as the super user"
user = "user"
prompt = { text = "Password: " }

[variants.flat-808080]
power = { profile = "performance", battery = { percentage = 37, charge = "charging" } }

[variants.flat-3584e4]
power = { profile = "performance", battery = { percentage = 37, charge = "charging" } }

[[steps]]
spawn = "polkit"
