# The on-screen display, as in GNOME's `osd` reference capture: an empty
# desktop and a request to show a volume icon at 60%.

[fixture]
time = "2026-11-14T08:28:00"
power = { profile = "performance", battery = { percentage = 91 } }
network = { primary = { kind = "wifi", strength = 70 } }

[variants.flat-808080]
power = { profile = "performance", battery = { percentage = 37, charge = "charging" } }

[variants.flat-3584e4]
power = { profile = "performance", battery = { percentage = 37, charge = "charging" } }

# What the capture asked GNOME Shell to show (tools/gnome-ref/capture.py).
[[steps]]
gniri = ["debug", "osd", "audio-volume-high-symbolic", "--level", "0.6"]
