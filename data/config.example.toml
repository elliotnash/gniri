# gniri configuration.
#
# Copy to ~/.config/gniri/config.toml and uncomment what you want to change.
# Every setting is optional; the values shown commented out are examples, and
# the defaults are given in the text. A misspelt key is an error, not ignored.
#
# gniri reads the file again whenever it changes: there is nothing to
# restart. docs/CONFIG.md says more about each setting.

[appearance]
# The style of the shell itself: its bar, its menus and the rest. (The
# Dark Style switch in the quick settings is for the applications.)
#   "prefer-dark" (default): GNOME's rule. Dark, unless the desktop's colour
#       scheme is "prefer-light", which no switch sets.
#   "prefer-light": light, and dark while the Dark Style switch is on.
#   "dark", "light": always that.
# style = "prefer-light"

[wallpaper]
# An image, scaled to cover each output. With neither `image` nor `color`,
# gniri draws no wallpaper (use this if another program draws yours).
# image = "/usr/share/backgrounds/f45/default/f45-01-night.jxl"

# A flat colour, used when there is no image.
# color = "#241f31"

[clock]
# "24h" (default) or "12h".
# format = "12h"

# Show the date before the time. Default: true.
# show_date = false

# Show the day of the week. Default: false.
# show_weekday = true

# Show seconds. Default: false.
# show_seconds = true

[panel]
# Show the battery charge as a number beside the icon. Default: false.
# show_battery_percentage = true

# Outputs that get a panel, by connector name (see `niri msg outputs`).
# Default: every output.
# outputs = ["eDP-1"]

[date_menu]
# The day a week starts on in the calendar: "sunday", "monday" or
# "saturday". Unset, it is the day your locale starts a week on.
# week_start = "monday"

# The "Add World Clocks…" and "Select Weather Location…" cards under the
# calendar. gniri shows neither clocks nor a forecast: the cards only start
# GNOME Clocks and GNOME Weather, and are hidden when those are not
# installed. Default: true.
# world_clocks = false
# weather = false

[night_light]
# Colour temperature of the screen while Night Light is on, in kelvin; lower
# is warmer. 1700 to 4700. Default: 2700.
# temperature = 3500

[idle]
# Seconds without input after which the screens turn off (GNOME's "Blank
# Screen Delay"). A video or a call that asks the compositor to stay awake
# holds this off. Default: 300. Set to 0 for never.
# blank_after = 600

# Dim the screen for the last fifth of that time. Default: true.
# dim = false

[lock]
# Lock when the screens turn off for idleness. Default: true.
# automatic = false

# Seconds between the screens turning off and the lock. Default: 0.
# delay = 30

# Lock before the machine sleeps. Default: true.
# on_suspend = false

[dash]
# The applications that are always in the dash, in order, by desktop entry
# (the name of a file in /usr/share/applications or
# ~/.local/share/applications, with or without ".desktop"). One that is not
# installed is left out. Default: GNOME's (Firefox, Calendar, Files,
# Software, Text Editor, Calculator).
# favorites = ["org.mozilla.firefox", "org.gnome.Nautilus", "org.gnome.Settings"]

# The size of the dash's icons: 16, 22, 24, 32, 48 or 64. Default: the
# largest that fits the screen, as in GNOME.
# icon_size = 48

[search]
# Ask the applications that offer search results (Files, Calculator,
# Characters, Software and so on) beside finding applications by name.
# Default: true.
# providers = false

# Applications that are not asked, by desktop entry.
# disabled = ["org.gnome.Software", "org.gnome.Boxes"]

[commands]
# The settings application, started as `<settings> <panel>` by entries such
# as "Power Settings" (panels: power, wifi, bluetooth, sound). Default:
# "gnome-control-center". Set to "" to hide those entries.
# settings = "my-settings-app"
