[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/theme",
    "crates/services",
    "crates/shell",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

# Every version is pinned here so the crates cannot drift apart.
[workspace.dependencies]
gniri-core = { path = "crates/core" }
gniri-config = { path = "crates/config" }
gniri-theme = { path = "crates/theme" }
gniri-services = { path = "crates/services" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
async-channel = "2"
roxmltree = "0.21"
# Follows niri releases and is not semver-stable: pin to the installed niri.
niri-ipc = "=26.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
