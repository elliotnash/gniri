[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/theme",
    "crates/services",
    "crates/shell",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

# Every version is pinned here so the crates cannot drift apart.
[workspace.dependencies]
gniri-core = { path = "crates/core" }
gniri-config = { path = "crates/config" }
gniri-theme = { path = "crates/theme" }
gniri-services = { path = "crates/services" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
# ext-session-lock, from the same C library as the layer shell.
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
async-channel = "2"
roxmltree = "0.21"
# The default runtime (async-io), never tokio.
zbus = "6"
futures-lite = "2"
# A second Wayland connection of our own, for protocols GTK does not speak
# (gamma control). Never GTK's connection: see docs/DECISIONS.md.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# "staging" holds ext-idle-notify.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# The PulseAudio client library, for the audio backend.
libpulse-binding = "2.30"
# PAM, for the lock screen. Links libpam (Fedora: pam-devel).
nonstick = "0.1"
# Follows niri releases and is not semver-stable: pin to the installed niri.
niri-ipc = "=26.4.0"
# For the shell to quit on SIGTERM: GLib's signal source, and the signal
# numbers (no calls into libc: `unsafe` is forbidden).
glib-unix = "0.22"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
