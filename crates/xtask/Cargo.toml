[package]
name = "xtask"
description = "Development and visual-test driver for gniri (run as `cargo xtask`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap.workspace = true
# "termination": also catch SIGTERM and SIGHUP, so `timeout` and a closed
# terminal stop the nested session too.
ctrlc = { version = "3", features = ["termination"] }
niri-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
